
name: Build PowerTools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Java 21 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven-Projektstruktur vorbereiten
        run: |
          mkdir -p src/main/java/de/powersmp/powertools
          mkdir -p src/main/resources
          mkdir -p lib

          cp PowerTools.java src/main/java/de/powersmp/powertools/PowerTools.java
          cp plugin.yml src/main/resources/plugin.yml
          cp config.yml src/main/resources/config.yml
          cp PowerEco.jar lib/PowerEco.jar

      - name: Plugin-Version setzen
        run: |
          sed -i "s/version: 1.3.3/version: 1.3.4/" src/main/resources/plugin.yml

      - name: Maven Build
        run: mvn -B clean package

      - name: ZIP vorbereiten
        run: |
          mkdir -p release
          cp target/PowerTools-1.3.4.jar release/
          cd release
          zip -r ../PowerTools-1.3.4.zip .

      - name: Dateien veröffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-1.3.4
          path: |
            target/PowerTools-1.3.4.jar
            PowerTools-1.3.4.zip
