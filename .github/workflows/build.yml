
name: Build PowerTools

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PowerTools 1.3.4
    runs-on: ubuntu-latest

    steps:
      # Repository herunterladen
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Maven-Projektstruktur erstellen
      - name: Prepare Project
        run: |
          mkdir -p src/main/java/de/powersmp/powertools
          mkdir -p src/main/resources
          mkdir -p lib

          cp PowerTools.java src/main/java/de/powersmp/powertools/PowerTools.java
          cp plugin.yml src/main/resources/plugin.yml
          cp config.yml src/main/resources/config.yml
          cp PowerEco.jar lib/PowerEco.jar

      # Fehler in der ChunkLoad-Methode automatisch beheben
      - name: Fix Chunk Entity Method
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/main/java/de/powersmp/powertools/PowerTools.java")
          source = file.read_text()

          old = "for (Item droppedItem : event.getChunk().getEntitiesByClass(Item.class)) {"

          new = """for (org.bukkit.entity.Entity entity : event.getChunk().getEntities()) {
                      if (!(entity instanceof Item droppedItem)) {
                          continue;
                      }"""

          if old not in source:
              raise SystemExit("FEHLER: Die erwartete Chunk-Schleife wurde nicht gefunden.")

          source = source.replace(old, new, 1)
          file.write_text(source)

          print("ChunkLoad-Methode erfolgreich angepasst.")
          PY

      # Maven-Projekt bauen
      - name: Build Plugin
        run: mvn -B clean package

      # Fertige Dateien vorbereiten
      - name: Prepare Release
        run: |
          mkdir -p release

          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Keine fertige Plugin-JAR gefunden!"
            exit 1
          fi

          cp "$JAR" release/PowerTools-1.3.4.jar

          cd release
          zip -r ../PowerTools-1.3.4.zip .

      # JAR und ZIP hochladen
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-1.3.4
          path: |
            release/PowerTools-1.3.4.jar
            PowerTools-1.3.4.zip
          if-no-files-found: error
